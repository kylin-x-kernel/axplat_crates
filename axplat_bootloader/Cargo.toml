[package]
name = "axplat_bootloader"
version = "0.1.0"
description = "Universal bootloader for axplat supporting multiple architectures and boot protocols"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
aarch64 = []
x86_64 = []
riscv64 = []


[dependencies]
cfg-if = "1.0"
log = "0.4"
bitflags = "2.6"

# axplat 相关
axplat = { workspace = true }
memory_addr = "0.4"

[target.'cfg(target_arch = "aarch64")'.dependencies]
page_table_entry = "0.5"
aarch64-cpu = "10.0"
fdt = { version = "0.1" }

[package.metadata. docs.rs]
all-features = true
